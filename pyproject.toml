[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visioncraft"
version = "0.1.0"
description = "Local-First Meeting Transcription & Confidential-Information Guardrail Engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Hridayansh", email = "hridayansh@example.com" }
]
dependencies = [
  "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0",
  "pytest-asyncio>=0.20.0"
]
asr = [
  "faster-whisper>=1.0.0",
  "webrtcvad>=2.0.10",
  "numpy>=1.20.0"
]
ner = [
  "presidio-analyzer>=2.2.0",
  "spacy>=3.5.0"
]
server = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "websockets>=12.0"
]

[project.scripts]
visioncraft = "visioncraft.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
